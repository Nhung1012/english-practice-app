<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện Nghe & Đọc Tiếng Anh</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%90%B1</text></svg>">
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #1e293b;
    --muted: #64748b;
    --border: #e2e8f0;
    --highlight: #fef08a;
    --green: #16a34a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 24px;
    margin: 0 0 4px;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 14px;
  }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--card);
    padding: 6px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    transition: 0.15s;
  }
  .tab-btn.active {
    background: var(--primary);
    color: white;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .row-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .level-group {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .level-btn {
    flex: 1;
    padding: 10px 6px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: var(--muted);
    transition: 0.15s;
  }
  .level-btn.active {
    border-color: var(--primary);
    background: #eff6ff;
    color: var(--primary);
  }
  .topic-display {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f1f5f9;
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 16px;
  }
  .topic-display span {
    font-weight: 600;
    font-size: 15px;
  }
  .topic-select-row {
    margin-bottom: 16px;
  }
  .topic-select-row select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    font-size: 14px;
    background: white;
    color: var(--text);
  }
  .btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-icon {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn.secondary {
    background: white;
    border: 1.5px solid var(--border);
    color: var(--text);
  }
  .btn.secondary:hover { background: #f1f5f9; }
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .script-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .script-header .row-label {
    margin-bottom: 0;
  }
  .copy-btn {
    padding: 6px 12px;
    font-size: 13px;
  }
  .copy-btn.copied {
    background: #dcfce7;
    border-color: var(--green);
    color: var(--green);
  }
  .script-box {
    line-height: 2;
    font-size: 16px;
    min-height: 60px;
  }
  .line {
    padding: 10px 12px;
    border-radius: 8px;
    margin-bottom: 6px;
    transition: background 0.2s;
  }
  .line.active {
    background: var(--highlight);
  }
  .speaker-a { color: var(--primary); font-weight: 700; }
  .speaker-b { color: #dc2626; font-weight: 700; }
  .listen-line { }
  .status {
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
    text-align: center;
  }
  .status.error {
    color: #dc2626;
  }
  .badge {
    display: inline-block;
    background: #dbeafe;
    color: var(--primary);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .source-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 8px;
  }
  .source-badge.live { background: #dcfce7; color: var(--green); }
  .source-badge.offline { background: #fee2e2; color: #dc2626; }

  /* ====== BẤM TỪ ĐỂ TRA PHIÊN ÂM + NGHĨA ====== */
  .word {
    cursor: pointer;
    border-radius: 4px;
    transition: background 0.12s;
    padding: 0 1px;
  }
  .word:hover { background: #e0edff; }
  .word.looking-up { background: #dbeafe; }

  .word-popup {
    position: fixed;
    z-index: 1000;
    width: 280px;
    max-width: calc(100vw - 24px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, 0.18);
    padding: 14px 16px;
    font-size: 14px;
    display: none;
  }
  .word-popup.show { display: block; }
  .wp-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 6px;
  }
  .wp-word {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
  }
  .wp-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .wp-btn {
    border: 1px solid var(--border);
    background: white;
    border-radius: 8px;
    padding: 4px 9px;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  .wp-btn:hover { background: #f1f5f9; }
  .wp-ipa {
    color: var(--primary);
    font-size: 15px;
    margin-bottom: 8px;
    min-height: 18px;
  }
  .wp-pos {
    display: inline-block;
    background: #f1f5f9;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .wp-vi {
    font-size: 15px;
    font-weight: 600;
    color: var(--green);
    margin-bottom: 8px;
    word-break: break-word;
  }
  .wp-example {
    font-size: 13px;
    color: var(--muted);
    font-style: italic;
    line-height: 1.5;
    border-top: 1px dashed var(--border);
    padding-top: 8px;
  }
  .wp-loading { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎧 Luyện Nghe &amp; Đọc Tiếng Anh</h1>
    <p>Chọn trình độ, random chủ đề, luyện nghe/đọc mỗi ngày</p>
    <p style="margin-top:4px">👆 Bấm vào bất kỳ từ nào để xem phiên âm &amp; nghĩa</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="dialogue">💬 Hội thoại 2 người</button>
    <button class="tab-btn" data-tab="listening">🎙️ Luyện nghe (script)</button>
  </div>

  <!-- LEVEL SELECT (shared) -->
  <div class="card">
    <div class="row-label">Trình độ</div>
    <div class="level-group" id="levelGroup">
      <button class="level-btn active" data-level="beginner">🟢 Cơ bản (A1-A2)</button>
      <button class="level-btn" data-level="intermediate">🟡 Trung cấp (B1-B2)</button>
      <button class="level-btn" data-level="advanced">🔴 Nâng cao (C1-C2)</button>
    </div>

    <div class="row-label">Chủ đề hôm nay</div>
    <div class="topic-display">
      <span id="topicText">—</span>
      <button class="btn secondary" id="randomBtn">🔀 Đổi chủ đề</button>
    </div>

    <div class="topic-select-row">
      <select id="topicSelect">
        <option value="">-- Hoặc chọn chủ đề có sẵn --</option>
      </select>
    </div>

    <div class="controls">
      <button class="btn" id="playBtn"><span class="btn-icon">▶️ Nghe</span></button>
    </div>
    <div class="status" id="statusText">Đang tải nội dung...</div>
  </div>

  <!-- SCRIPT DISPLAY -->
  <div class="card">
    <div class="script-header">
      <div class="row-label" id="scriptLabel">Nội dung</div>
      <button class="btn secondary copy-btn" id="copyBtn">📋 Copy</button>
    </div>
    <div class="script-box" id="scriptBox"></div>
  </div>
</div>

<!-- Popup tra từ (bấm vào từ trong script) -->
<div class="word-popup" id="wordPopup">
  <div class="wp-head">
    <span class="wp-word" id="wpWord"></span>
    <div class="wp-actions">
      <button class="wp-btn" id="wpSpeak" title="Nghe phát âm">🔊</button>
      <button class="wp-btn" id="wpClose" title="Đóng">✕</button>
    </div>
  </div>
  <div class="wp-ipa" id="wpIpa"></div>
  <div id="wpPos"></div>
  <div class="wp-vi" id="wpVi"></div>
  <div class="wp-example" id="wpExample" style="display:none"></div>
</div>

<!-- supabase-js qua CDN, không cần build tool -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ====== CẤU HÌNH SUPABASE ======
// URL và anon key đều là thông tin CÔNG KHAI, an toàn để để trong frontend
// vì bảng "content" chỉ cho phép SELECT (xem supabase_schema.sql, policy
// "Public read access"). KHÔNG bao giờ đặt service_role key ở đây.
const SUPABASE_URL = "https://jlczlapfhqvfiktcpdwf.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KAmDWtIWM3CzA8xrDRu19A_5Xtf0A1u";

const supabaseClient = (SUPABASE_URL.includes("YOUR-PROJECT-REF") || !window.supabase)
  ? null
  : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ====== STATE ======
// Toàn bộ nội dung lấy động từ Supabase — không còn dữ liệu fix cứng nào
// trong frontend. Nếu chưa kết nối được DB, app hiển thị thông báo lỗi
// thay vì dùng nội dung mẫu.
let currentTab = "dialogue";
let currentLevel = "beginner";
let currentItem = null;

// "Phiên đọc" hiện tại. Một số trình duyệt (đặc biệt Chrome) vẫn bắn ra
// sự kiện onend/onerror của câu đang đọc dở dù đã gọi speechSynthesis.cancel()
// khi utterance đang ở trạng thái pause — khiến vòng lặp đọc câu tiếp theo
// (speakNext) tiếp tục chạy ngầm dù người dùng đã đổi chủ đề/trình độ/tab.
// Dùng số phiên tăng dần để speakNext tự huỷ nếu không còn thuộc phiên hiện tại.
let speechSession = 0;

const topicText = document.getElementById('topicText');
const scriptBox = document.getElementById('scriptBox');
const scriptLabel = document.getElementById('scriptLabel');
const statusText = document.getElementById('statusText');
const randomBtn = document.getElementById('randomBtn');
const playBtn = document.getElementById('playBtn');
const topicSelect = document.getElementById('topicSelect');

function setStatus(msg, isError) {
  statusText.textContent = msg;
  statusText.classList.toggle('error', !!isError);
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// ====== GIỌNG ĐỌC NAM (Người A) / NỮ (Người B) ======
// Web Speech API không cho chọn "giới tính" trực tiếp, nên cố gắng tìm 2
// giọng tiếng Anh khác nhau theo tên (từ khoá Male/Female hoặc tên riêng
// quen thuộc của các giọng có sẵn trên Windows/macOS/Chrome). Đồng thời
// luôn chỉnh thêm pitch (cao độ) khác nhau giữa A/B để đảm bảo 2 người luôn
// nghe khác nhau, kể cả khi máy không có sẵn giọng nam/nữ riêng biệt.
let maleVoice = null;
let femaleVoice = null;

function loadVoicesAsync() {
  return new Promise((resolve) => {
    const existing = window.speechSynthesis.getVoices();
    if (existing.length) { resolve(existing); return; }
    window.speechSynthesis.onvoiceschanged = () => {
      resolve(window.speechSynthesis.getVoices());
    };
    // Phòng khi trình duyệt không bắn sự kiện voiceschanged
    setTimeout(() => resolve(window.speechSynthesis.getVoices()), 1500);
  });
}

async function initVoices() {
  const voices = await loadVoicesAsync();
  const enVoices = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith('en'));
  const pool = enVoices.length ? enVoices : voices;
  if (!pool.length) return;

  const maleKeywords = ['male', 'man', 'david', 'mark', 'daniel', 'guy', 'fred', 'alex', 'tom', 'james'];
  const femaleKeywords = ['female', 'woman', 'zira', 'samantha', 'susan', 'victoria', 'karen', 'moira', 'tessa', 'fiona'];

  maleVoice = pool.find(v => maleKeywords.some(k => v.name.toLowerCase().includes(k))) || null;
  femaleVoice = pool.find(v => v !== maleVoice && femaleKeywords.some(k => v.name.toLowerCase().includes(k))) || null;

  // Không tìm được giọng khớp tên (nhiều máy chỉ có 1-2 giọng không rõ giới
  // tính) → lấy tạm 2 giọng khác nhau trong danh sách, vẫn phân biệt được
  // A/B nhờ pitch bên dưới.
  if (!maleVoice) maleVoice = pool[0];
  if (!femaleVoice) femaleVoice = pool.find(v => v !== maleVoice) || pool[0];
}
initVoices();

function getSpeakerVoiceSettings(speaker) {
  if (speaker === 'A') return { voice: maleVoice, pitch: 0.85 };
  if (speaker === 'B') return { voice: femaleVoice, pitch: 1.25 };
  return { voice: null, pitch: 1 };
}

// ====== DANH SÁCH CHỦ ĐỀ ĐỂ CHỌN TRỰC TIẾP ======
// Danh sách chủ đề lấy hoàn toàn từ Supabase theo đúng tab + trình độ
// đang chọn, để người dùng chọn thẳng thay vì chỉ random.
let topicOptions = [];
let topicOptionsSession = 0;

function renderTopicSelect() {
  const options = ['<option value="">-- Hoặc chọn chủ đề có sẵn --</option>'].concat(
    topicOptions.map((opt, i) =>
      `<option value="${i}">${escapeHtml(opt.topic)}</option>`
    )
  );
  topicSelect.innerHTML = options.join('');
  syncTopicSelectValue();
}

function syncTopicSelectValue() {
  if (!currentItem) { topicSelect.value = ''; return; }
  const idx = topicOptions.findIndex(opt => opt.topic === currentItem.topic);
  topicSelect.value = idx >= 0 ? String(idx) : '';
}

// Gemini đôi khi sinh trùng tên chủ đề giữa các lần chạy khác ngày (cùng
// type/level), nên danh sách có thể có 2 bản ghi khác id nhưng cùng tên
// chủ đề. Lọc bớt (so sánh không phân biệt hoa/thường), giữ bản đầu tiên.
function dedupeByTopic(options) {
  const seen = new Set();
  return options.filter((opt) => {
    const key = (opt.topic || '').trim().toLowerCase();
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

async function loadTopicOptions() {
  topicOptionsSession++;
  const mySession = topicOptionsSession;

  topicOptions = [];
  renderTopicSelect();

  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('content')
      .select('id, topic')
      .eq('type', currentTab)
      .eq('level', currentLevel)
      .order('id', { ascending: true });
    // Nếu người dùng đã đổi tab/trình độ khác trong lúc chờ, bỏ qua kết quả này.
    if (mySession !== topicOptionsSession) return;
    if (error || !data) return;
    topicOptions = dedupeByTopic(data.map(row => ({ topic: row.topic, id: row.id })));
    renderTopicSelect();
  } catch (err) {
    console.warn('Không lấy được danh sách chủ đề từ Supabase:', err);
  }
}

async function loadSelectedTopic(opt) {
  speechSession++;
  window.speechSynthesis.cancel();
  setPlayButton('idle');
  setStatus('Đang tải chủ đề...');

  try {
    if (!supabaseClient) throw new Error('Chưa cấu hình Supabase');

    const { data, error } = await supabaseClient
      .from('content')
      .select('topic, data')
      .eq('id', opt.id)
      .single();
    if (error || !data) throw error || new Error('Không tìm thấy chủ đề đã chọn');

    currentItem = currentTab === 'dialogue'
      ? { topic: data.topic, lines: data.data.lines }
      : { topic: data.topic, text: data.data.text };
    topicText.textContent = currentItem.topic;
    renderScript();
    syncTopicSelectValue();
    setStatus('Nhấn "Nghe" để bắt đầu');
  } catch (err) {
    console.error('Lỗi khi tải chủ đề đã chọn:', err);
    setStatus('Có lỗi khi tải chủ đề đã chọn, vui lòng thử lại.', true);
  }
}

// Lấy 1 bản ghi ngẫu nhiên từ Supabase qua RPC get_random_content
// (xem hàm trong supabase_schema.sql). Trả về null nếu lỗi/không cấu hình.
async function fetchFromSupabase(type, level) {
  if (!supabaseClient) return null;
  try {
    const { data, error } = await supabaseClient
      .rpc('get_random_content', { p_type: type, p_level: level });
    if (error) throw error;
    if (!data || data.length === 0) return null;
    const row = data[0];
    if (type === 'dialogue') {
      return { topic: row.topic, lines: row.data.lines };
    }
    return { topic: row.topic, text: row.data.text };
  } catch (err) {
    console.warn('Không lấy được dữ liệu từ Supabase, dùng nội dung dự phòng:', err.message || err);
    return null;
  }
}

async function loadNewItem() {
  speechSession++; // vô hiệu hoá mọi vòng lặp speakNext còn sót lại từ chủ đề cũ
  window.speechSynthesis.cancel();
  setPlayButton('idle');
  randomBtn.disabled = true;
  setStatus('Đang tải chủ đề mới...');
  loadTopicOptions(); // làm mới danh sách chủ đề để chọn, chạy song song không cần chờ

  // Ghi nhớ chủ đề đang hiển thị để tránh việc "random" ra đúng chủ đề cũ
  // khi data pool cho trình độ này còn ít bản ghi.
  const previousTopic = currentItem ? currentItem.topic : null;
  const maxAttempts = 3;

  try {
    let newItem = null;

    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const fromDb = await fetchFromSupabase(currentTab, currentLevel);
      if (!fromDb) break;
      newItem = fromDb;
      if (!previousTopic || newItem.topic !== previousTopic) break;
    }

    if (!newItem) {
      topicText.textContent = '—';
      scriptBox.innerHTML = '';
      currentItem = null;
      setStatus('Chưa tải được nội dung từ Supabase. Kiểm tra kết nối mạng hoặc thử lại sau.', true);
      return;
    }

    currentItem = newItem;
    topicText.textContent = currentItem.topic;
    renderScript();
    syncTopicSelectValue();
    setStatus('Nhấn "Nghe" để bắt đầu');
  } catch (err) {
    console.error('Lỗi khi tải chủ đề mới:', err);
    setStatus('Có lỗi khi tải chủ đề mới, vui lòng thử lại.', true);
  } finally {
    // Luôn bật lại nút dù thành công hay lỗi, tránh việc nút bị kẹt "disabled"
    // khiến người dùng bấm "Đổi chủ đề" mà không thấy phản ứng gì.
    randomBtn.disabled = false;
  }
}

// Tách một đoạn text thành HTML, mỗi từ tiếng Anh được bọc trong
// <span class="word"> để bấm tra phiên âm/nghĩa; dấu câu & khoảng trắng
// giữ nguyên. Trả về chuỗi HTML đã escape an toàn.
function tokenizeWords(text) {
  // Chia thành các đoạn: từ (chữ cái, có thể kèm ' hoặc - ở giữa) và phần còn lại.
  const parts = String(text).split(/([A-Za-z]+(?:[''\-][A-Za-z]+)*)/);
  return parts.map((part, i) => {
    // Các phần tử ở chỉ số lẻ là "từ" đã bắt được trong nhóm regex.
    if (i % 2 === 1 && part) {
      return `<span class="word">${escapeHtml(part)}</span>`;
    }
    return escapeHtml(part);
  }).join('');
}

function renderScript() {
  scriptBox.innerHTML = '';
  if (currentTab === 'dialogue') {
    scriptLabel.textContent = 'Hội thoại';
    currentItem.lines.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'line';
      div.id = 'line-' + i;
      const speakerLabel = line.s === 'A' ? 'Người A' : 'Người B';
      const speakerClass = line.s === 'A' ? 'speaker-a' : 'speaker-b';
      div.innerHTML = `<span class="${speakerClass}">${speakerLabel}:</span> ${tokenizeWords(line.t)}`;
      scriptBox.appendChild(div);
    });
  } else {
    scriptLabel.textContent = 'Script luyện nghe';
    const sentences = currentItem.text.match(/[^.!?]+[.!?]+/g) || [currentItem.text];
    sentences.forEach((sent, i) => {
      const div = document.createElement('div');
      div.className = 'line listen-line';
      div.id = 'line-' + i;
      div.innerHTML = tokenizeWords(sent.trim());
      scriptBox.appendChild(div);
    });
  }
}

function clearHighlight() {
  document.querySelectorAll('.line').forEach(el => el.classList.remove('active'));
}

// Trạng thái nút Nghe: 'idle' (chưa đọc/đã đọc xong) | 'playing' (đang đọc) | 'paused' (đang tạm dừng)
let playState = 'idle';

function setPlayButton(state) {
  playState = state;
  if (state === 'playing') {
    playBtn.innerHTML = '<span class="btn-icon">⏸️ Tạm dừng</span>';
  } else if (state === 'paused') {
    playBtn.innerHTML = '<span class="btn-icon">▶️ Tiếp tục</span>';
  } else {
    playBtn.innerHTML = '<span class="btn-icon">▶️ Nghe</span>';
  }
}

function speakAll() {
  if (!currentItem) return;
  speechSession++;
  const mySession = speechSession;
  window.speechSynthesis.cancel();
  let textsToSpeak = [];

  if (currentTab === 'dialogue') {
    textsToSpeak = currentItem.lines.map(l => l.t);
  } else {
    textsToSpeak = (currentItem.text.match(/[^.!?]+[.!?]+/g) || [currentItem.text]).map(s => s.trim());
  }

  setStatus('Đang đọc...');
  setPlayButton('playing');

  function speakNext(index) {
    // Nếu người dùng đã đổi chủ đề/trình độ/tab (loadNewItem tăng speechSession)
    // trong lúc utterance trước đang phát/tạm dừng, dừng hẳn vòng lặp này lại,
    // không đọc tiếp câu tiếp theo của chủ đề cũ nữa.
    if (mySession !== speechSession) return;
    if (index >= textsToSpeak.length) {
      clearHighlight();
      setStatus('Đã đọc xong. Nhấn "Nghe" để nghe lại.');
      setPlayButton('idle');
      return;
    }
    clearHighlight();
    const lineEl = document.getElementById('line-' + index);
    if (lineEl) {
      lineEl.classList.add('active');
      lineEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    const utter = new SpeechSynthesisUtterance(textsToSpeak[index]);
    utter.lang = 'en-US';
    utter.rate = 1;
    if (currentTab === 'dialogue' && currentItem.lines[index]) {
      const voiceSettings = getSpeakerVoiceSettings(currentItem.lines[index].s);
      if (voiceSettings.voice) utter.voice = voiceSettings.voice;
      utter.pitch = voiceSettings.pitch;
    }
    utter.onend = () => speakNext(index + 1);
    utter.onerror = () => speakNext(index + 1);
    window.speechSynthesis.speak(utter);
  }

  speakNext(0);
}

// ====== TRA TỪ: PHIÊN ÂM (IPA) + NGHĨA TIẾNG VIỆT ======
// Bấm vào 1 từ trong script → popup hiện phiên âm, từ loại, ví dụ (lấy từ
// dictionaryapi.dev) và nghĩa tiếng Việt (lấy từ API dịch miễn phí). Kết quả
// được cache trong phiên để không gọi lại API cho cùng một từ.
const wordPopup = document.getElementById('wordPopup');
const wpWord = document.getElementById('wpWord');
const wpIpa = document.getElementById('wpIpa');
const wpPos = document.getElementById('wpPos');
const wpVi = document.getElementById('wpVi');
const wpExample = document.getElementById('wpExample');
const wpSpeak = document.getElementById('wpSpeak');
const wpClose = document.getElementById('wpClose');

const wordCache = {};        // từ (đã chuẩn hoá) -> { ipa, pos, example, vi }
let currentPopupWord = '';   // từ đang hiển thị (để nút 🔊 đọc)
let lookupSession = 0;       // huỷ kết quả cũ nếu người dùng bấm từ khác

// Bỏ dấu câu, đưa về chữ thường để tra cứu; giữ ' và - trong từ.
function normalizeWord(raw) {
  return String(raw).toLowerCase().replace(/[^a-z''\-]/g, '').replace(/^[''\-]+|[''\-]+$/g, '');
}

// Tra phiên âm IPA + từ loại + ví dụ từ dictionaryapi.dev (miễn phí, không cần key).
async function fetchDictionary(word) {
  try {
    const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
    if (!res.ok) return { ipa: '', pos: '', example: '' };
    const data = await res.json();
    const entry = Array.isArray(data) ? data[0] : null;
    if (!entry) return { ipa: '', pos: '', example: '' };

    let ipa = entry.phonetic || '';
    if (!ipa && Array.isArray(entry.phonetics)) {
      const p = entry.phonetics.find(x => x && x.text);
      if (p) ipa = p.text;
    }

    let pos = '', example = '';
    if (Array.isArray(entry.meanings) && entry.meanings.length) {
      pos = entry.meanings.map(m => m.partOfSpeech).filter(Boolean).slice(0, 3).join(', ');
      for (const m of entry.meanings) {
        for (const d of (m.definitions || [])) {
          if (d.example) { example = d.example; break; }
        }
        if (example) break;
      }
    }
    return { ipa, pos, example };
  } catch (err) {
    return { ipa: '', pos: '', example: '' };
  }
}

// Dịch từ sang tiếng Việt. Thử Google (gtx) trước, fallback sang MyMemory.
async function fetchTranslation(word) {
  try {
    const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(word);
    const res = await fetch(url);
    if (res.ok) {
      const j = await res.json();
      if (j && Array.isArray(j[0])) {
        const vi = j[0].map(seg => (seg && seg[0]) ? seg[0] : '').join('').trim();
        if (vi) return vi;
      }
    }
  } catch (err) { /* thử nguồn dự phòng bên dưới */ }

  try {
    const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=en|vi';
    const res = await fetch(url);
    if (res.ok) {
      const j = await res.json();
      if (j && j.responseData && j.responseData.translatedText) {
        return String(j.responseData.translatedText).trim();
      }
    }
  } catch (err) { /* bỏ qua */ }

  return '';
}

// Đọc riêng 1 từ bằng giọng đọc sẵn có (Web Speech API), không cần mạng.
function speakWord(word) {
  if (!word) return;
  speechSession++;                 // dừng vòng đọc script đang chạy (nếu có)
  window.speechSynthesis.cancel();
  setPlayButton('idle');
  const utter = new SpeechSynthesisUtterance(word);
  utter.lang = 'en-US';
  utter.rate = 0.85;
  const v = femaleVoice || maleVoice;
  if (v) utter.voice = v;
  window.speechSynthesis.speak(utter);
}

function positionPopup(anchorEl) {
  // Hiện popup để đo kích thước thật rồi mới định vị.
  wordPopup.classList.add('show');
  const rect = anchorEl.getBoundingClientRect();
  const pw = wordPopup.offsetWidth;
  const ph = wordPopup.offsetHeight;
  const margin = 8;

  let left = rect.left + rect.width / 2 - pw / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - pw - margin));

  let top = rect.bottom + 6;            // mặc định hiện bên dưới từ
  if (top + ph > window.innerHeight - margin) {
    top = rect.top - ph - 6;            // không đủ chỗ → hiện bên trên
    if (top < margin) top = margin;
  }
  wordPopup.style.left = left + 'px';
  wordPopup.style.top = top + 'px';
}

function hideWordPopup() {
  wordPopup.classList.remove('show');
  document.querySelectorAll('.word.looking-up').forEach(el => el.classList.remove('looking-up'));
}

async function showWordPopup(rawWord, anchorEl) {
  const word = normalizeWord(rawWord);
  if (!word) return;

  currentPopupWord = word;
  lookupSession++;
  const mySession = lookupSession;

  document.querySelectorAll('.word.looking-up').forEach(el => el.classList.remove('looking-up'));
  anchorEl.classList.add('looking-up');

  // Trạng thái ban đầu
  wpWord.textContent = word;
  wpIpa.textContent = '';
  wpPos.innerHTML = '';
  wpVi.innerHTML = '<span class="wp-loading">Đang tra…</span>';
  wpExample.style.display = 'none';
  wpExample.textContent = '';
  positionPopup(anchorEl);

  // Dùng cache nếu đã tra trước đó
  if (wordCache[word]) {
    renderPopupData(wordCache[word]);
    positionPopup(anchorEl);
    return;
  }

  const [dict, vi] = await Promise.all([fetchDictionary(word), fetchTranslation(word)]);
  if (mySession !== lookupSession) return;   // người dùng đã bấm từ khác

  const info = { ipa: dict.ipa, pos: dict.pos, example: dict.example, vi };
  wordCache[word] = info;
  renderPopupData(info);
  positionPopup(anchorEl);
}

function renderPopupData(info) {
  wpIpa.textContent = info.ipa ? info.ipa : '(không có phiên âm)';
  if (info.pos) {
    wpPos.innerHTML = '<span class="wp-pos">' + escapeHtml(info.pos) + '</span>';
  } else {
    wpPos.innerHTML = '';
  }
  wpVi.textContent = info.vi ? info.vi : '(chưa dịch được — kiểm tra mạng)';
  if (info.example) {
    wpExample.textContent = '“' + info.example + '”';
    wpExample.style.display = 'block';
  } else {
    wpExample.style.display = 'none';
  }
}

// Bấm vào từ trong script (event delegation)
scriptBox.addEventListener('click', (e) => {
  const el = e.target.closest('.word');
  if (!el) return;
  e.stopPropagation();
  showWordPopup(el.textContent, el);
});

wpSpeak.addEventListener('click', (e) => { e.stopPropagation(); speakWord(currentPopupWord); });
wpClose.addEventListener('click', (e) => { e.stopPropagation(); hideWordPopup(); });
wordPopup.addEventListener('click', (e) => e.stopPropagation());

// Đóng popup khi bấm ra ngoài, cuộn trang, đổi kích thước hoặc nhấn Esc
document.addEventListener('click', hideWordPopup);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideWordPopup(); });
window.addEventListener('resize', hideWordPopup);
window.addEventListener('scroll', hideWordPopup, true);

// ====== EVENTS ======
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    loadNewItem();
  });
});

document.querySelectorAll('.level-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLevel = btn.dataset.level;
    loadNewItem();
  });
});

function getPlainTextContent() {
  if (currentTab === 'dialogue') {
    return currentItem.lines
      .map(line => `${line.s === 'A' ? 'Người A' : 'Người B'}: ${line.t}`)
      .join('\n');
  } else {
    return currentItem.text;
  }
}

document.getElementById('copyBtn').addEventListener('click', async () => {
  if (!currentItem) return;
  const copyBtn = document.getElementById('copyBtn');
  const textToCopy = `Chủ đề: ${currentItem.topic}\n\n${getPlainTextContent()}`;
  try {
    await navigator.clipboard.writeText(textToCopy);
    copyBtn.textContent = '✅ Đã copy!';
    copyBtn.classList.add('copied');
    setTimeout(() => {
      copyBtn.textContent = '📋 Copy';
      copyBtn.classList.remove('copied');
    }, 1500);
  } catch (err) {
    const textarea = document.createElement('textarea');
    textarea.value = textToCopy;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    try {
      document.execCommand('copy');
      copyBtn.textContent = '✅ Đã copy!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '📋 Copy';
        copyBtn.classList.remove('copied');
      }, 1500);
    } catch (e) {
      copyBtn.textContent = '❌ Lỗi copy';
      setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 1500);
    }
    document.body.removeChild(textarea);
  }
});

randomBtn.addEventListener('click', loadNewItem);
topicSelect.addEventListener('change', () => {
  const idx = topicSelect.value;
  if (idx === '') return;
  const opt = topicOptions[Number(idx)];
  if (!opt) return;
  loadSelectedTopic(opt);
});
playBtn.addEventListener('click', () => {
  if (playState === 'idle') {
    speakAll();
  } else if (playState === 'playing') {
    window.speechSynthesis.pause();
    setStatus('Đã tạm dừng');
    setPlayButton('paused');
  } else if (playState === 'paused') {
    window.speechSynthesis.resume();
    setStatus('Đang đọc...');
    setPlayButton('playing');
  }
});

// init
loadNewItem();
</script>
